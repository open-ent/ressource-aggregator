<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Médiacentre</title>
    <link rel="icon" id="favicon" href="" />
    <!-- Bootstrap openent partagé, chargé au runtime (comme le thème Angular) :
         une mise à jour du look = mise à jour de ce seul fichier, sans recompiler le module. -->
    <link rel="stylesheet" href="/assets/themes/openent-bootstrap/index.css" />
    <style>
      /* Retouches layout thème 1d. */
      @media (min-width: 768px) {
        /* Menu compte (communauté / moteur de recherche / mon compte) : le thème
           natif prévoit déjà une rangée inline desktop pour ce menu, via une règle
           réservée à [data-product=neo] (@open-ent/bootstrap) :
             [data-product=neo] .header .navbar .dropdown-menu {
               position: static !important; display: flex; background: transparent;
               flex-direction: row; padding: 0; border-radius: 0; border: 0; box-shadow: none;
             }
           En thème 1d cette règle ne s'applique jamais -> le menu reste un dropdown
           replié en position:absolute (caché), d'où l'ancien correctif en position:fixed
           qui le replaçait n'importe où au lieu de l'intégrer dans le header. On reproduit
           ici la VRAIE règle neo, sans dépendre de data-product. */
        #dropdown-navbar.dropdown-menu {
          position: static !important;
          display: flex !important;
          background: transparent !important;
          flex-direction: row !important;
          padding: 0 !important;
          border-radius: 0 !important;
          border: 0 !important;
          box-shadow: none !important;
        }
        /* Même raison : tailles d'icônes réservées à [data-product=neo], reproduites ici. */
        #dropdown-navbar.dropdown-menu .icon {
          width: 1.6rem !important;
          height: 1.6rem !important;
        }
        #dropdown-navbar.dropdown-menu .nav-link > svg {
          width: 3.2rem !important;
          height: 3.2rem !important;
        }
        /* Le <main class="container-fluid"> qui enveloppe le contenu était plafonné à
           1352px et collé à gauche -> on lui rend sa pleine largeur. */
        main.container-fluid,
        .container-fluid {
          max-width: none !important;
        }
        /* Puis on plafonne et on centre le contenu (marges égales gauche/droite),
           SANS jamais recouvrir la sidebar fixe à icônes (75px) : elle est en
           position:fixed donc hors du flux, "margin: auto" seul l'ignorait et le
           contenu venait se plaquer sous elle (texte tronqué à gauche). */
        .med-container,
        .med-search-container,
        .med-signets-container {
          width: auto !important;
          max-width: 1675px !important;
          margin-left: calc(75px + max(0px, (100% - 1675px) / 2)) !important;
          margin-right: max(0px, calc((100% - 1675px) / 2)) !important;
        }
      }
    </style>
    <script>
         wsPort = "{{wsPort}}";
      mode = "{{mode}}";
      sources = [
      	{{#sources}}
      		"{{.}}",
      	{{/sources}}
      ];
      mediacentreUpdateFrequency = {{mediacentreUpdateFrequency}};
      window.config = {
        wsPort: "{{wsPort}}",
        mode: "{{mode}}",
        sources: [
          {{#sources}}
            "{{.}}",
          {{/sources}}
        ],
        mediacentreUpdateFrequency: {{mediacentreUpdateFrequency}},
      };
    </script>
  </head>
  <body>
    <div 
      id="root"
      data-is-pin-hightlight={{highlightsPins}}
      data-text-pin-hightlight="{{textHighlightsPins}}"
    ></div>
    <div id="portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
